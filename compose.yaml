services:
  mysql:
    image: 'mysql:8.4.9'
    environment:
      - 'MYSQL_DATABASE=pokemon-card-shop'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=user'
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
  redis:
    image: 'redis:8.0'
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data: