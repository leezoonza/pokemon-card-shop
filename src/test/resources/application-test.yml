spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    hibernate:
      ddl-auto: create-drop

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

app:
  cors:
    allowed-origin: http://localhost:3000

  auth:
    redirect:
      signup-uri: http://localhost/signup
      login-uri: http://localhost/login
      failure-uri: http://localhost/login/error

    token:
      access-token:
        secret: integration-test-secret-key-with-32-bytes
        ttl: 10m
      refresh-token:
        ttl: 7d
